settings:
  spotify:
    token_url: https://accounts.spotify.com/api/token
    search_url: https://api.spotify.com/v1/search
    search_types:
      - track
    # Matriz de búsqueda: término × año. Escala a 200k-500k ampliando esta lista.
    # LÍMITE VERIFICADO 2026-09-15: esta app rechaza limit>10 con 400 "Invalid limit"
    # (probado: 10 OK, 20 FAIL). No subir sin re-probar.
    # Techo por query: limit(10) × 100 páginas = 1.000 (offsets 0-990).
    # 32 términos × 8 años × 1.000 = 256k brutos máximos.
    query_terms:
      - techno
      - house
      - trance
      - edm
      - dance
      - electro
      - progressive
      - minimal
      - tech-house
      - melodic techno
      - guaracha
      - afro house
      - hard techno
      - peak time techno
      - raw techno
      - industrial techno
      - hard groove
      - dub techno
      - deep house
      - latin house
      - tribal house
      - funky house
      - bass house
      - uplifting trance
      - psytrance
      - goa trance
      - hard trance
      - drum and bass
      - dubstep
      - uk garage
      - breakbeat
      - jungle
    limit: 10
    # La API rechaza limit>10 (400 "Invalid limit") y limita offset+limit <= 1000.
    # Con limit=10 el último offset útil es 990.
    max_search_offset: 990
    # Presupuesto por corrida. La app en Development Mode banea ~24 h al pasar
    # de ~600 requests diarios: se sube gradualmente (300 -> 400 -> 500).
    request_budget: 400
    # Páginas por query y por corrida (10 páginas = 100 requests = 1.000 tracks).
    pages_per_query_run: 10
    sleep_seconds: 2

  project:
    start_year: 2018
    end_year: 2025
    # Cobertura del modo daily. 8 = toda la matriz (2018-2025): el cursor
    # decide qué falta, así que restringir años solo desperdicia cuota.
    recent_years: 8
    # 0 = sin filtro. Subir a 20-30 para quedarse con tracks relevantes.
    min_popularity: 0

  mongodb:
    database: spotify_electronica_colombia
    raw_collection: raw_search_results
    curated_collection: curated_tracks
    runs_collection: ingestion_runs
